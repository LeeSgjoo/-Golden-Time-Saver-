<!-- Login Page -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Golden Time Saver - Login</title>

 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body{
      font-family:"Noto Sans KR", system-ui, -apple-system, Segoe UI, Roboto, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    .brand-blue{ color:#2f5bff; }
    .brand-btn{
      background:#2f5bff !important;
      border-color:#2f5bff !important;
    }
    .brand-btn:hover{
      background:#244cff !important;
      border-color:#244cff !important;
    }
  </style>
</head>

<body>
  <div class="min-vh-100 d-flex align-items-center justify-content-center bg-light px-3">
    <div class="w-100" style="max-width: 900px;">
      <div class="text-center mb-3">
        <div
          class="d-inline-flex align-items-center justify-content-center rounded-4 shadow-sm mb-3"
          style="width:72px; height:72px; background:#2f5bff;"
          aria-hidden="true"
        >
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
            <path
              d="M3 12h4l2-6 4 14 2-8h4"
              stroke="#fff"
              stroke-width="2.3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>

        <h1 class="fw-bold mb-1 brand-blue" style="letter-spacing:-0.02em;">
          Golden Time Saver
        </h1>
        <div class="text-secondary">응급 의료 통합 관리 시스템</div>
      </div>

      <!-- Card -->
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
          <h2 class="fw-black mb-4" style="font-weight:900;">로그인</h2>

          <!--
            Bootstrap validation 패턴:
            - form에 novalidate
            - submit 시 checkValidity() false면 was-validated 추가
          -->
          <form id="loginForm" novalidate>
            <!-- 아이디 -->
            <div class="mb-3">
              <label for="userId" class="form-label fw-semibold">ID</label>
              <input
                id="userId"
                name="userId"
                type="text"
                class="form-control rounded-3"
                placeholder="아이디를 입력하세요"
                required
                minlength="2"
              />
              <div class="invalid-feedback">아이디를 입력하세요 (2자 이상).</div>
            </div>

            <!-- 비밀번호 -->
            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">password</label>
              <input
                id="password"
                name="password"
                type="password"
                class="form-control rounded-3"
                placeholder="비밀번호를 입력하세요"
                required
                minlength="1"
              />
              <div class="invalid-feedback">비밀번호를 입력하세요 (1자 이상).</div>
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100 py-3 fw-bold rounded-3 brand-btn"
              id="loginBtn"
            >
              로그인
            </button>
          </form>
        </div>
      </div>

      <!-- Footer -->
      <div class="text-center small text-secondary mt-3">© Golden Time Saver</div>
    </div>
  </div>

  <script>
    (function () {
      const form = document.getElementById("loginForm");
      const userIdEl = document.getElementById("userId");
      const passwordEl = document.getElementById("password");
      const loginBtn = document.getElementById("loginBtn");

      // React의 state처럼 "현재 값"만 보관할 객체
      const state = {
        validated: false,
        form: { userId: "", password: "" }
      };

      const syncStateFromInputs = () => {
        state.form.userId = userIdEl.value;
        state.form.password = passwordEl.value;
      };

      const setValidated = (v) => {
        state.validated = v;
        if (v) form.classList.add("was-validated");
        else form.classList.remove("was-validated");
      };

      // onChange 대응
      userIdEl.addEventListener("input", () => {
        syncStateFromInputs();
      });
      passwordEl.addEventListener("input", () => {
        syncStateFromInputs();
      });

     
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        e.stopPropagation();

        syncStateFromInputs();

        // 브라우저 constraint validation 활용
        if (!form.checkValidity()) {
          setValidated(true);
          return;
        }

        setValidated(true);

      
        alert("149-164번째 줄 - 로그인 버튼 (submit) 관련 로직 여기있습니다!.");

        // 여기서 fetch로 스프링 로그인 API 붙이면 됨
        // ex) fetch("/api/login", {method:"POST", headers:{...}, body: JSON.stringify(state.form)})
      });

      // (선택) 클릭 시에도 동일하게 작동하게 하고 싶으면 유지
      // loginBtn.addEventListener("click", () => {});
    })();
  </script>
</body>
</html>
